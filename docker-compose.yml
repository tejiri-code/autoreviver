services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_NODE_API_URL=http://localhost:4000
    depends_on:
      - node-api

  node-api:
    build: ./node-api
    ports:
      - "4000:4000"
    env_file: .env
    depends_on:
      - mongo
      - ai-api

  ai-api:
    build: ./ai-api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - mongo
    volumes:
      - ./data:/app/data
      - chroma_data:/app/chroma

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: autoreviver
      MONGO_INITDB_ROOT_PASSWORD: autoreviver
      MONGO_INITDB_DATABASE: autoreviver
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  chroma_data:
